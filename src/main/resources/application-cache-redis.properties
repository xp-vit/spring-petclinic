# Redis settings active only under the `cache-redis` profile (cache benchmark).
#
# Host/port default to a local Redis container; the run harness overrides them via the
# SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT env vars (relaxed binding wins over this).
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Lettuce connection pool. By default Lettuce multiplexes ALL commands over a single
# connection, which head-of-line-blocks when cached values are large (a big GET/SET ties up
# the one pipe while every other request waits). A pool gives concurrent requests separate
# connections so large-value transfers run in parallel. Required for the heavy-payload
# (report) workload; commons-pool2 must be on the classpath for this to take effect.
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=64
spring.data.redis.lettuce.pool.max-idle=64
spring.data.redis.lettuce.pool.min-idle=8
spring.data.redis.lettuce.pool.max-wait=2000ms
