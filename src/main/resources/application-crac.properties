# CRaC variant profile. Activated alongside 'postgres' only for the CRaC
# checkpoint/restore builds, so the jvm and native variants are unaffected.
petclinic.crac.enabled=true
# Required for a clean checkpoint: lets Spring Boot's HikariCheckpointRestoreLifecycle
# fully suspend + close the pool (and its sockets) in beforeCheckpoint. Without
# this the checkpoint aborts with CheckpointOpenSocketException on the DB socket.
spring.datasource.hikari.allow-pool-suspension=true
# Give in-flight requests a moment to drain when the pool is suspended.
spring.datasource.hikari.connection-timeout=20000
