# Virtual-thread (Project Loom) benchmark profile.
#
# Activate alongside a datasource profile, e.g. SPRING_PROFILES_ACTIVE=postgres,loom.
# The thread mode is toggled independently of this profile:
#   spring.threads.virtual.enabled=false  -> platform threads (Tomcat default, ~200 max)
#   spring.threads.virtual.enabled=true   -> virtual threads
# Keep everything else identical between the two runs.

# Co-located slow-HTTP stub (fixed-delay stand-in for a slow external API).
loom.stub.url=${LOOM_STUB_URL:http://localhost:9090}

# Tomcat worker pool. Left at the framework default (200) so the platform-thread run has a
# real, documented saturation point. Overridable for sensitivity checks.
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:200}

# HikariCP sizing drives the /api/slow-db connection-pool story. Default is Boot's default
# (10); the AWS run sweeps 10 vs 100 to show the pool becoming the bottleneck once threads
# are cheap.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}
