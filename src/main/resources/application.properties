# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Internationalization
spring.messages.basename=messages/messages

# Cache: default to Caffeine. spring-boot-starter-data-redis is on the classpath for the
# cache benchmark, and Boot's cache auto-config would otherwise prefer Redis (higher priority)
# whenever no explicit CacheManager bean is active (default profile / tests) and try to connect
# to localhost:6379. Pinning the type keeps the default an in-heap Caffeine cache; the
# cache-redis / cache-none profiles still override it with their own CacheManager beans.
spring.cache.type=caffeine

# Actuator
management.endpoints.web.exposure.include=*
# Don't fail /actuator/health when Redis is absent (it is only used under the cache-redis
# profile, and even there it connects lazily on first cache access).
management.health.redis.enabled=false

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h
